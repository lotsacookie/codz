<script type="module" id="launcher-script">
// One page for every map. Picking a map loads it hidden behind its own button (progress bar on the button),
// then swaps it in and starts it. No second page, no second menu.
const launcher = document.getElementById('launcher');
const list = document.getElementById('map-list');
const note = document.getElementById('launcher-note');
const errorBox = document.getElementById('launcher-error');
const buttons = [...list.querySelectorAll('button[data-map]')];
const IDLE_NOTE = note.textContent;
let booting = false;

const setEnabled = enabled => { for (const b of buttons) b.disabled = !enabled; };
function showError(message) { errorBox.textContent = message; errorBox.hidden = false; }

function loadStyle(href) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.media = 'not all'; // downloaded now, applied only when the map is shown, so it cannot restyle this list
    link.onload = () => resolve(link);
    link.onerror = () => { link.remove(); reject(new Error(`Could not load ${href}`)); };
    document.head.append(link);
  });
}

function showBootFailure(label, error) {
  console.error(error);
  const box = document.createElement('div');
  box.id = 'boot-failure';
  box.setAttribute('role', 'alert');
  const title = document.createElement('strong');
  title.textContent = `${label} could not start`;
  const detail = document.createElement('p');
  detail.textContent = error?.message ?? String(error);
  const back = document.createElement('a');
  back.href = './';
  back.textContent = 'Back to maps';
  box.append(title, detail, back);
  document.body.append(box);
}

// Progress bar living on the chosen map's button.
function makeMeter(button) {
  const fill = document.createElement('i');
  fill.className = 'map-fill';
  button.prepend(fill);
  button.classList.add('loading');
  const caption = button.querySelector('span');
  const original = caption.textContent;
  let value = 0;
  return {
    set(percent, text) {
      value = Math.max(value, Math.min(100, percent));
      fill.style.width = `${value}%`;
      if (text) caption.textContent = `${Math.round(value)}% · ${text}`;
    },
    get value() { return value; },
    reset() { fill.remove(); button.classList.remove('loading'); caption.textContent = original; },
  };
}

// Each map reports loading differently; these adapters turn that into one "percent + text + ready/failed" feed.
function watchKino(meter, done, fail) {
  const bar = document.getElementById('load-progress'), label = document.getElementById('load-label');
  const start = document.getElementById('start'), loading = document.getElementById('loading');
  const tick = () => {
    meter.set(parseFloat(bar.style.width) || 0, label.textContent.trim());
    if (!start.disabled) done(() => start.click());
    else if (document.getElementById('retry') || document.getElementById('texture-choice') || /^Unable to start/.test(label.textContent)) fail();
  };
  const observer = new MutationObserver(tick);
  observer.observe(bar, { attributes: true, attributeFilter: ['style'] });
  observer.observe(label, { childList: true, characterData: true, subtree: true });
  observer.observe(start, { attributes: true, attributeFilter: ['disabled'] });
  observer.observe(loading, { childList: true });
  tick();
  return () => observer.disconnect();
}

function stagePercent(text) {
  const mb = text.match(/(\d+)\s*\/\s*(\d+)\s*MB/i);
  const mbF = mb && +mb[2] ? Math.min(1, +mb[1] / +mb[2]) : 0;
  if (/collision/i.test(text)) return 60 + 25 * mbF;
  if (/zombies and weapons/i.test(text)) return 88;
  if (/station systems|quest/i.test(text)) return 94;
  return 4 + 56 * mbF;
}

function watchStatus(meter, map, done, fail) {
  const status = document.getElementById('status');
  const startButton = document.getElementById('start'); // Moon has one; viewer maps start on a click in the scene
  const read = () => {
    const text = status.textContent.trim();
    if (/could not load|unable to load/i.test(text)) return fail();
    const ready = startButton ? !startButton.disabled : status.hidden || !/^(Loading|Retrying)/i.test(text);
    if (ready) return done(startButton ? () => startButton.click() : null);
    meter.set(stagePercent(text), text);
  };
  const observer = new MutationObserver(read);
  observer.observe(status, { childList: true, characterData: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
  if (startButton) observer.observe(startButton, { attributes: true, attributeFilter: ['disabled'] });
  // Slow creep so the bar never looks frozen between status updates; real progress always wins.
  const creep = setInterval(() => meter.set(Math.min(92, meter.value + (92 - meter.value) * 0.02)), 500);
  read();
  return () => { observer.disconnect(); clearInterval(creep); };
}

async function boot(button) {
  if (booting) return;
  booting = true;
  setEnabled(false);
  errorBox.hidden = true;
  const { map, label, module, title, bodyClass } = button.dataset;
  note.textContent = `Loading ${label}…`;
  const meter = makeMeter(button);
  const template = document.getElementById(`map-${map}`);
  const styles = [];
  const abort = message => {
    for (const link of styles) link.remove();
    meter.reset();
    document.body.classList.remove('launcher-booting');
    note.textContent = IDLE_NOTE;
    showError(message);
    setEnabled(true);
    booting = false;
  };
  try {
    if (!template) throw new Error(`No layout is defined for ${label}.`);
    for (const href of (button.dataset.styles ?? '').split(/\s+/).filter(Boolean)) styles.push(await loadStyle(href));
  } catch (error) { return abort(error.message); }

  const params = new URLSearchParams(location.search);
  params.set('map', map);
  history.replaceState(null, '', `?${params}`);
  meter.set(2, 'Preparing');

  // Mount the map's own markup (hidden) and run its module; the launcher stays visible meanwhile.
  document.body.classList.add('launcher-booting');
  document.body.prepend(template.content.cloneNode(true));
  let stop = () => {};
  let finished = false;
  const reveal = async startGame => {
    if (finished) return;
    finished = true;
    stop();
    meter.set(100, 'Starting');
    await new Promise(resolve => setTimeout(resolve, 250)); // let the bar visibly reach the end
    for (const link of styles) link.media = 'all';
    document.title = title || document.title;
    launcher.remove();
    document.body.className = bodyClass ?? '';
    startGame?.();
  };
  // On a load error, show the map anyway so its own error message and RETRY button are visible.
  const fail = () => { if (finished) return; finished = true; stop(); for (const link of styles) link.media = 'all'; launcher.remove(); document.body.className = bodyClass ?? ''; };
  stop = map === 'kino' ? watchKino(meter, reveal, fail) : watchStatus(meter, map, reveal, fail);
  try {
    await import(module);
  } catch (error) {
    finished = true; stop();
    launcher.remove(); // map markup stays hidden (launcher-booting) behind the failure box
    showBootFailure(label, error);
  }
}

list.addEventListener('click', event => {
  const button = event.target.closest('button[data-map]');
  if (button && !button.disabled) boot(button);
});

const requested = new URLSearchParams(location.search).get('map');
if (requested) {
  const button = buttons.find(candidate => candidate.dataset.map === requested);
  if (button) boot(button);
  else showError(`There is no map called "${requested}". Choose one from the list.`);
}
</script>
