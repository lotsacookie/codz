name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The unit tests read this LFS object; the rest of the ~1 GB LFS set is not needed.
  LFS_TEST_FILES: export/web/assets/moon/collision.bin

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve LFS object ids
        id: lfs
        run: echo "key=$(git lfs ls-files -l -I "$LFS_TEST_FILES" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ steps.lfs.outputs.key }}

      - name: Fetch LFS test data
        run: git lfs pull --include="$LFS_TEST_FILES"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
