name: Build asset pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - export/web/assets/textures/**
      - export/web/assets/textures-mobile/**
      - export/web/assets/models/**
      - export/web/assets/animations/**
      - export/web/assets/kino.gltf
      - export/web/assets/game-data.json
      - export/web/assets/moon/textures/**
      - export/web/assets/moon/models/**
      - export/web/assets/moon/combat-data.json
      - export/web/assets/shangri-la/textures/**
      - export/web/assets/ascension/textures/**
      - export/web/assets/coast/textures/**
      - export/web/assets/js/asset-pack.js
      - .tools/build-asset-pack.mjs

permissions:
  contents: write

concurrency:
  group: asset-pack
  cancel-in-progress: false

env:
  LFS_FILES: export/web/assets/textures/*,export/web/assets/textures-mobile/*,export/web/assets/models/*,export/web/assets/moon/models/*,export/web/assets/moon/textures/*,export/web/assets/shangri-la/textures/*,export/web/assets/ascension/textures/*,export/web/assets/coast/textures/*

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve LFS object ids
        id: lfs
        run: echo "key=$(git lfs ls-files -l -I "$LFS_FILES" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-pack-${{ steps.lfs.outputs.key }}

      - name: Fetch LFS media
        run: git lfs pull --include="$LFS_FILES"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build packs
        run: node .tools/build-asset-pack.mjs

      - name: Verify packs
        run: node .tools/build-asset-pack.mjs --verify

      - name: Commit packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add export/web/assets/asset-pack/*.pack
          if git diff --cached --quiet; then
            echo "Asset packs are already up to date."
            exit 0
          fi
          git commit -m "Update asset packs from ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
