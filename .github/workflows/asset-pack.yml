name: Build asset pack

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-pack
  cancel-in-progress: false

env:
  LFS_FILES: export/web/textures/*,export/web/textures-mobile/*,export/web/models/*
  RELEASE_TAG: asset-pack

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve LFS object ids
        id: lfs
        run: echo "key=$(git lfs ls-files -l -I "$LFS_FILES" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-pack-${{ steps.lfs.outputs.key }}

      - name: Fetch LFS media
        run: git lfs pull --include="$LFS_FILES"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build packs
        run: node .tools/build-asset-pack.mjs

      - name: Verify packs
        run: node .tools/build-asset-pack.mjs --verify

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd export/web/asset-pack
          sha256sum kino-desktop.pack kino-mobile.pack > SHA256SUMS
          notes="Built from ${GITHUB_SHA} (workflow run ${GITHUB_RUN_ID}). Put both .pack files in an asset-pack/ folder next to index.html."
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$notes"
            gh release upload "$RELEASE_TAG" kino-desktop.pack kino-mobile.pack SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" kino-desktop.pack kino-mobile.pack SHA256SUMS --target "$GITHUB_SHA" --title "Kino asset pack" --notes "$notes" --latest=false
          fi
