name: Rebake Shangri-La collision

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-shangri-la
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bake collision
        run: node --import ./.tools/lib/vendor-resolve.mjs .tools/bake-shangri-la.mjs

      - name: Check baked files
        run: |
          test "$(stat -c %s export/web/assets/shangri-la/collision.bin)" -gt 1000000
          node --import ./.tools/lib/vendor-resolve.mjs --test test/shangri-la.test.mjs test/shangri-la-grid.test.mjs

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/web/assets/shangri-la/collision.bin export/web/assets/shangri-la/collision.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Shangri-La: rebake collision data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
